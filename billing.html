
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect | Billing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Campus Connect</a>
        <a class="btn btn-light" href="products.html">Back to Store</a>
    </div>
</nav>

<div class="container my-5">
    <h1>Billing Details</h1>
    <p>Enter your information to complete your demo order.</p>
    <p class="text-danger">Use test payment information only.</p>

    <div class="row">

        <div class="col-md-7">
            <div class="card p-4 shadow-sm">

                <h3>Billing Information</h3>

                <form id="billingForm">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control" id="city" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">ZIP Code</label>
                        <input type="text" class="form-control" id="zip" required>
                    </div>

                    <h4>Payment Information</h4>

                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control" id="cardNumber"
                               placeholder="Demo card only" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Expiration Date</label>
                        <input type="text" class="form-control" id="expiration"
                               placeholder="MM/YY" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Security Code</label>
                        <input type="password" class="form-control" id="cvv" required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Submit Order
                    </button>

                </form>

                <div id="message" class="mt-3"></div>

            </div>
        </div>

        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <h3>Order Summary</h3>

                <div id="cartItems"></div>

                <hr>

                <p>Shipping: Free</p>
                <h4>Total: $<span id="cartTotal">0.00</span></h4>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="billing.js"></script>

</body>
</html>
